<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Яка спеціальність ІТБ НаУОА тобі підходить?</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3fbfa;--fg:#1d1d1b;--card:#fff;--line:#bfece8;--soft:#e3f7f5;--mid:#1f8f88;--acc:#81d8d0;--dark:#1d1d1b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:500 16px/1.5 Montserrat,system-ui,Arial,sans-serif}
.banner{width:100%;display:block;max-height:240px;object-fit:cover;object-position:center}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1,h2,h3{font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1.2;margin:0 0 12px}
h1{font-size:clamp(22px,5vw,32px)}h2{font-size:clamp(18px,4.2vw,24px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 6px 24px rgba(47,65,65,.08)}
.btn{font:700 15px Montserrat,sans-serif;border:0;border-radius:12px;padding:14px 22px;background:var(--dark);color:var(--bg);cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--acc);color:#1d1d1b}.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}.chip{background:var(--soft);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden;margin-bottom:6px}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mid);font-weight:700;margin-bottom:16px}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:6px;padding:3px 8px;background:var(--soft);margin-bottom:10px}.tag.meme{background:var(--acc);color:#1d1d1b}
.opt{display:block;width:100%;text-align:left;font:600 15px/1.4 Montserrat,sans-serif;color:var(--fg);background:transparent;border:2px solid var(--line);border-radius:12px;padding:13px 16px;margin:0 0 10px;cursor:pointer;transition:.15s}
.opt:hover,.opt.sel{border-color:var(--mid);background:var(--soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.big{font-size:clamp(20px,5vw,28px);font-weight:800;text-transform:uppercase;color:var(--mid);margin:4px 0 10px}
.prof{margin:18px 0}.prof div.l{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:4px}
.res{border-top:1px solid var(--line);margin-top:18px;padding-top:18px}
input{width:100%;font:500 15px Montserrat,sans-serif;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);margin-bottom:10px}
.hide{display:none}.mk{display:block;width:auto;max-width:100%;height:auto;max-height:210px;object-fit:contain;border-radius:16px;margin:0 auto 16px}small{color:var(--mid)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.top img{width:48px;height:48px;border-radius:10px}.top b{font-size:13px;text-transform:uppercase;letter-spacing:.04em}
body{background:linear-gradient(130deg,#effdfb,#bff1ec 30%,#81d8d0 60%,#d9f7f3);background-size:300% 300%;animation:flow 16s ease infinite;background-attachment:fixed}
@keyframes flow{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.card{background:rgba(255,255,255,.9);backdrop-filter:blur(8px)}
.btn{background:linear-gradient(135deg,#1d1d1b,#2f4141)}.btn:hover{background:linear-gradient(135deg,#81d8d0,#b5efe9)}
.bar i{background:linear-gradient(90deg,#81d8d0,#3fbdb2)}.chip{background:linear-gradient(135deg,#e3f7f5,#b5efe9);color:#1d1d1b}
.mk{background:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.12))}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bc{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font:600 13px/1.3 Montserrat,sans-serif;color:var(--fg);background:transparent;border:2px solid var(--line);border-radius:14px;padding:10px 8px;cursor:pointer}
.bc img{width:100%;height:120px;object-fit:contain;border-radius:8px}.bc b{font-size:14px}.bc span{color:var(--mid)}.bc:hover,.bc.sel{border-color:var(--acc);background:var(--soft)}.bc:last-child{grid-column:1/-1}
#si{max-height:320px}body{background:linear-gradient(135deg,#6fd0c8,#85d7d5 35%,#a9e8e2 65%,#79d6ce);background-size:300% 300%;animation:flow 14s ease infinite;background-attachment:fixed;color:#1d1d1b}
:root{--mid:#2c5654;--acc:#85d7d5;--soft:#d8f5f2;--line:#9fe0da}
.card{background:rgba(255,255,255,.82)}
h1,h2,h3,.big{color:#274948}
.btn{background:#274948;color:#fff}.btn:hover{background:#fff;color:#274948}
.opt:hover,.opt.sel,.bc:hover,.bc.sel{background:#d8f5f2;border-color:#274948}
.bar{background:rgba(44,86,84,.15)}.bar i{background:linear-gradient(90deg,#274948,#4aa8a0)}
.chip{background:#85d7d5;color:#1d1d1b}.meta,.bc span{color:#274948}
#si{border-radius:20px;max-height:340px;filter:none;box-shadow:0 6px 18px rgba(44,86,84,.2)}
</style></head><body>
